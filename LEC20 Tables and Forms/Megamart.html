<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megamart Hiring</title>
</head>
<body>
    <h1>Megamart Hiring</h1>
    <form >
        <div>
            <label for="name">Name</label>
            <input 
            id="name" 
            type="text"
            placeholder="Enter ur Full name"   
            />
        </div>
        <br>
        <div>
            <label for="email">Email</label>
            <input 
            id="email" 
            type="email"
            placeholder="Enter ur mail"   
            />
        </div>
        <br>
        <div>
            <label for="phone">Phone Number</label>
            <input 
            id="phone" 
            type="number"
            placeholder="Enter ur  Phone Number"   
            />
        </div>
        <br>
        <div>
          <label for="location">Location</label>
          <select name="location" id="location">
            <option>baner</option>
            <option>viman nagar</option>
            <option>hadapsar</option>
            <option>hinjewadi</option>
          </select>
        </div>
        <br>
          <div>
        <label for="resume">Resume</label>
        <input id="resume" type="file">
          </div>
          <br>
          <div>
        <label for="expected salary"> Expected Salary</label>
        <input 
        id="expected salary" 
        type="number"
        placeholder="in lacs"
        />
          </div>
          <br>
          <div>
          <div>
        <label for="current salary"> Current Salary</label>
        <input 
        id="current salary" 
        type="number"
        placeholder="in lacs"
        />
          </div>
          <br>
          <div>
            <label for="experience">Previous Experience</label>
            <input id="experience" type="checkbox">
          </div>
          <br>
          <div>
            <label for="morning">Morning Shift</label>
            <input name="shift" id="morning" type="radio">
          </div>
          <br>
          <div>
            <label for="night">Night Shift</label>
            <input name="shift" id="night" type="radio">
          </div>
          <br>
          <div>
            <label for="date">Joining Date</label>
            <input name="date" id="date" type="date">
          </div>
          <br>
          <div>
            <button type="submit">Submit</button>
          </div>
          <br>
    </form>
</body>
</html>
