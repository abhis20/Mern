<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <input type="password" maxlength="8" placeholder="password">
    <br>
    <br>
    <input type="date">
    <br>
    <input type="time">
    <br>
    <input type="checkbox" value="a">
    <input type="checkbox" value="b">
    <input type="checkbox" value="c">
    <input type="checkbox" value="d">
    <br>
    <input name="mcq1" type="radio" value="optionA">
    <input name="mcq1" type="radio" value="optionB">
    <input name="mcq1" type="radio" value="optionC" >
    <input name="mcq1" type="radio" value="optionD">
    <br>
    <input name="mcq2" type="radio" value="optionA" >
    <input name="mcq2" type="radio" value="optionB" >
    <input name="mcq2" type="radio" value="optionC">
    <input name="mcq2" type="radio" value="optionD">
    <br>
    <select name="" id="singleselect">
        <option value="">Select Any</option>
        <option >A</option>
        <option >B</option>
        <option >C</option>
        <option >D</option>
    </select>
    <br>
    <br>
    
    <select name="" id="multiselect" multiple="true" size="2">
        <option value="">Select Multiple</option>
        <option >A</option>
        <option >B</option>
        <option >C</option>
        <option >D</option>
    </select>

    <br>
    <br>
    <input type="file">
    <br>
    <br>
    <button>Submit</button>

    <script src="script.js"></script>
</body>
</html>
