<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        h1 {
            font-size: 3rem;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 1rem;
        }
        span {
            display: block;
            margin-top: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>00:00</h1>

    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>

    <span></span>

    <script>
        /*************************************************
         * ELEMENT SELECTION
         *************************************************/
        const startBtn = document.querySelector("#start");
        const stopBtn = document.querySelector("#stop");
        const resetBtn = document.querySelector("#reset");
        const h1Ele = document.querySelector("h1");
        const spanTag = document.querySelector("span");

        /*************************************************
         * STATE VARIABLES
         *************************************************/
        let seconds = 0;
        let timer = null;

        /*************************************************
         * START TIMER
         *************************************************/
        startBtn.addEventListener("click", () => {

            // Prevent multiple intervals
            if (timer !== null) return;

            spanTag.textContent = "Timer started";

            timer = setInterval(() => {
                seconds++;

                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;

                h1Ele.textContent =
                    `${minutes < 10 ? "0" : ""}${minutes}:` +
                    `${remainingSeconds < 10 ? "0" : ""}${remainingSeconds}`;

            }, 1000);
        });

        /*************************************************
         * STOP TIMER
         *************************************************/
        stopBtn.addEventListener("click", () => {
            clearInterval(timer);
            timer = null;
            spanTag.textContent = "Timer stopped";
        });

        /*************************************************
         * RESET TIMER
         *************************************************/
        resetBtn.addEventListener("click", () => {
            clearInterval(timer);
            timer = null;
            seconds = 0;
            h1Ele.textContent = "00:00";
            spanTag.textContent = "Timer reset";
        });
    </script>

</body>
</html>
