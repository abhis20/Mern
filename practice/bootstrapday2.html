<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Hello, world!</title>
  </head>
  <body>
     
    <h1 class="display-5 fw-bold text-center mt-2">Bootstrap Flexbox Utilities Demo</h1>
    <div class="d-flex justify-content-center">
        <div class="bg-primary p-2 mt-3 text-white">Box 1</div>
        <div class="bg-danger p-2 mt-3  text-white"> Box 2</div>
    </div>
    <div class="bg-warning d-flex align-items-center m-5" style="height: 120px;">
    <div class="bg-dark h-40 text-white p-2">vertically Centered</div>
</div>

<div class="bg-info d-flex justify-content-between align-items-center m-5 " style="height: 90px;">
    <div class="bg-success text-white p-2 m-2">Left</div>
    <div class="bg-warning text-white p-2 m-2">Middle</div>
    <div class="bg-danger text-white p-2 m-2">Right</div>
</div>




    <!-- Optional JavaScript; choose one of the two! -->
