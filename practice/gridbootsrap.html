<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Hello, world!</title>

  </head>
  <body>
     <style>
  .opacity-75 { opacity: 0.75; }
  .opacity-50 { opacity: 0.50; }
  .opacity-25 { opacity: 0.25; }
</style>

    <h1 class="display-3 text-center">Bootstrap Grid System Demo</h1>

  <div class="row p-2" >
    <div class="col text-white bg-primary p-3 ">Col</div>
    <div class="col text-white bg-danger  p-3">Col</div>
    <div class="col text-white bg-success p-3 ">Col</div>
  </div>

    <div class="row p-2" >
    <div class="col-4 text-white bg-warning p-3 ">Col-4</div>
    <div class="col-8 text-white bg-info  p-3">Col-8</div>
  </div>

    <div class="row p-2" >
    <div class="col-lg-4 col-12 col-sm-6 text-white bg-dark p-3 ">Box1</div>
    <div class="col-lg-4 col-12 col-sm-6 text-white bg-secondary  p-3">Box2</div>
    <div class="col-lg-4 col-12 col-sm-6 text-white bg-primary p-3 ">Box3</div>
  </div>


  <div class="bg-primary mt-3 p-3 text-white opacity-75">Opacity 75</div>
  <div class="bg-primary mt-3 p-3 text-white opacity-50">Opacity 50</div>
  <div class="bg-primary mt-3 p-3 text-white opacity-25">Opacity 25</div>
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  </body>
</html>
